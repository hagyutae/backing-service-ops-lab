---
# 세션 2 · 챕터 12 · Sharding 으로 확장
#
#
#   ansible-playbook play-mongodb-shard.yml
#
# ── 전제 ─────────────────────────────────────────────────────
# 1. 자기 PC 에서 terraform apply 로 노드 여섯 대를 추가했다
# 2. ops 노드의 inventory/hosts.ini 에 새 노드 여섯 대를 손으로 넣었다
#    인벤토리는 ops 노드가 부팅할 때 한 번만 만들어진다. 다시 apply 해도
#    cloud-init 은 재실행되지 않으므로 새 노드가 저절로 들어오지 않는다
#
#    [configsvr]
#    cfg-1 ansible_host=10.0.1.8
#    cfg-2 ansible_host=10.0.1.9
#    cfg-3 ansible_host=10.0.1.10
#
#    [shard2]
#    shard2-1 ansible_host=10.0.1.11
#    shard2-2 ansible_host=10.0.1.12
#    shard2-3 ansible_host=10.0.1.13
#
# ── 포트를 27017 로 고정하는 이유 ────────────────────────────
# clusterRole 을 주면 기본 포트가 바뀐다. shardsvr 는 27018, configsvr 는
# 27019 다. mongod.conf 템플릿이 net.port 를 명시하므로 27017 로 남는다.
# 그러지 않으면 인벤토리와 sh.addShard 의 주소가 어긋난다.
#
# ── 새 노드에도 인증을 켜는 이유 ─────────────────────────────
# 챕터 10 에서 rs0 에 인증을 켰다. 클러스터 안에서 멤버끼리 주고받는 통신은
# 같은 keyFile 을 요구하므로, 인증이 꺼진 노드는 shard 로 편입되지 않는다.
# 1회차 검증에서 이 설정이 빠져 있어 config server 와 shard2 가 붙지 않았다.
#
# keyFile 은 mongodb 롤이 groups['mongo'][0] 에서 만들어 복사한다. 새 노드도
# 같은 파일을 받으므로 rs0 과 같은 키를 쓴다.
#
# ── 초기화는 노드 안에서 한다 ────────────────────────────────
# 인증이 켜진 새 세트에는 계정이 아직 없다. MongoDB 의 localhost 예외가
# 그 상태에서만 열리는데, 예외는 그 노드 안에서 127.0.0.1 로 붙었을 때만
# 적용된다. ops 노드에서 사설 IP 로 붙으면 Authentication failed 가 난다.
#
# ── 기존 rs0 을 shardsvr 로 다시 세우는 이유 ─────────────────
# mongo-1·mongo-2·mongo-3 은 챕터 02 에서 clusterRole 없이 올라갔다.
# 그대로 두고 sh.addShard 를 부르면 거부된다. MongoDB 문서의 전환 절차가
# SECONDARY 부터 한 대씩, 마지막에 rs.stepDown() 뒤 옛 PRIMARY 를
# shardsvr 로 재기동하라고 명시한다. serial: 1 이 그 순서를 만든다.

- name: config server 노드 구성
  hosts: configsvr
  become: true
  serial: 1
  vars:
    data_mount_path: /var/lib/mongodb
    mongodb_target: server
    mongodb_cluster_role: configsvr
    mongodb_replset_enabled: true
    mongodb_replset_name: cfg
    mongodb_auth_enabled: true
  roles:
    - common
    - mongodb

- name: shard2 노드 구성
  hosts: shard2
  become: true
  serial: 1
  vars:
    data_mount_path: /var/lib/mongodb
    mongodb_target: server
    mongodb_cluster_role: shardsvr
    mongodb_replset_enabled: true
    mongodb_replset_name: shard2
    mongodb_auth_enabled: true
  roles:
    - common
    - mongodb

# 이미 돌고 있는 rs0 을 shardsvr 로 전환한다. 한 대씩 재기동하므로
# 과반이 유지되고 서비스가 이어진다.
- name: 기존 rs0 을 shardsvr 로 전환
  hosts: mongo
  become: true
  serial: 1
  vars:
    mongodb_target: server
    mongodb_cluster_role: shardsvr
    mongodb_replset_enabled: true
    mongodb_auth_enabled: true
  roles:
    - mongodb

- name: 새 노드에 exporter 설치
  hosts: configsvr:shard2
  become: true
  roles:
    - role: monitoring
      monitoring_target: node
      monitoring_service: mongodb

# 새 노드가 인벤토리에 들어왔으므로 Prometheus 대상 목록을 다시 만든다.
- name: Prometheus 대상 갱신
  hosts: ops
  become: true
  roles:
    - role: monitoring
      monitoring_target: server
      monitoring_service: mongodb
