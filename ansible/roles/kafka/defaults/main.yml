---
# Kafka 4.3.x. KRaft 전용이다. 4.0 에서 ZooKeeper 가 제거됐다.
#
# 패치 번호를 박는 이유는 배포본을 tarball 로 받기 때문이다. apt 저장소가
# 아니라 아카이브 주소를 직접 치므로 「최신」이라는 주소가 없다.
# 버전을 올릴 때는 이 값 하나만 고친다.
kafka_version: "4.3.1"

# 배포본은 Scala 버전별로 나뉜다. 4.x 는 2.13 하나뿐이다.
kafka_scala_version: "2.13"
kafka_mirror: "https://archive.apache.org/dist/kafka"

kafka_user: kafka
kafka_group: kafka
kafka_install_dir: /opt/kafka

# 데이터 디스크의 마운트 지점이다. common 롤이 여기에 붙인다.
# 세그먼트 파일이 OS 디스크가 아니라 데이터 디스크에 쌓여야
# retention 실습에서 디스크가 차는 것을 관찰할 수 있다.
kafka_log_dir: /var/lib/kafka

kafka_client_port: 9092
kafka_controller_port: 9093

# JVM 힙 2 GiB.
#
# Kafka 는 메시지를 힙에 캐싱하지 않고 OS page cache 에 의존한다.
# 힙을 키우면 그만큼 page cache 가 줄어 읽기가 디스크로 내려간다.
# 8 GiB 노드에서 OS·exporter 1 GiB, 힙 2 GiB, page cache 약 5 GiB 다.
kafka_heap_opts: "-Xms2g -Xmx2g"

# 토픽을 만들 때 값을 주지 않으면 쓰이는 기본값이다.
# 실습 토픽은 명령에서 명시하므로 이 값에 기대지 않는다.
kafka_default_replication_factor: 3
kafka_num_partitions: 3

# 보관 기간 판정 주기. 제품 기본값은 300000 이다.
#
# retention 실습이 retention.ms 를 60000 으로 걸고 세그먼트가 지워지는 것을
# 본다. 기본값 그대로면 판정 한 번에 최대 5분이 걸려 관찰 구간이 강의 흐름
# 밖으로 밀린다. 같은 값으로 낮춰 최악 2분 안에 보이게 한다.
kafka_retention_check_interval_ms: 60000

# 자동 토픽 생성을 끈다.
#
# 켜져 있으면 오타 난 토픽 이름으로 consume 했을 때 그 이름의 토픽이
# 조용히 생긴다. 수강생이 「왜 메시지가 안 보이지」로 한참 헤매게 된다.
kafka_auto_create_topics: false

# ── JMX exporter ─────────────────────────────────────────────
# kafka_exporter 는 토픽·파티션·컨슈머 그룹 지표만 낸다. ActiveControllerCount
# 처럼 브로커 내부의 JMX MBean 값은 내지 않고, 그 문서가 「다른 지표는 JMX
# exporter 를 보라」고 적고 있다.
#
# 그래서 브로커 프로세스에 java agent 로 붙인다. 별도 프로세스가 아니라
# JVM 안에서 돌므로 브로커가 죽으면 이 지표도 함께 끊긴다. 그것이 맞는 동작이다.
#
# 2일차 장애대응 세션이 ActiveControllerCount·ISR shrink rate·
# RequestHandlerAvgIdlePercent 를 쓴다. 셋 다 여기서만 나온다.
kafka_jmx_exporter_version: "1.0.1"
kafka_jmx_exporter_port: 9404
kafka_jmx_exporter_dir: /opt/jmx-exporter
