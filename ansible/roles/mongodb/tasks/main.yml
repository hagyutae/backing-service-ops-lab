---
# MongoDB 설치와 설정.
#
# 서비스 노드에는 mongod 를, ops 노드에는 클라이언트 도구를 깐다.
# 어느 쪽인지는 play-mongodb.yml 이 mongodb_target 으로 정한다.

# get_url 은 없는 디렉터리를 만들지 않는다. Ubuntu 24.04 가 /etc/apt/keyrings 를
# 기본으로 두기는 하지만, 없으면 여기서 그대로 실패하고 첫 플레이북이 멈춘다.
- name: apt 키링 디렉터리
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

# 키 번호는 mongodb_major 가 아니라 mongodb_key_series 다. 이유는 defaults 에 있다.
- name: MongoDB 저장소 키
  ansible.builtin.get_url:
    url: "https://www.mongodb.org/static/pgp/server-{{ mongodb_key_series }}.asc"
    dest: /etc/apt/keyrings/mongodb.asc
    mode: "0644"

- name: MongoDB 저장소 등록
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb.asc]
      https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/{{ mongodb_major }} multiverse
    filename: mongodb-org
    state: present
    update_cache: true

# ── ops 노드: 클라이언트 도구 ────────────────────────────────
- name: 클라이언트 도구 설치
  ansible.builtin.package:
    name: "{{ mongodb_ops_packages }}"
    state: present
  when: mongodb_target == "client"

# 서비스 노드에도 mongosh 를 깐다.
#
# 챕터 12 에서 config server 와 shard2 를 초기화할 때 그 노드 안에서 친다.
# 인증이 켜진 뒤라 localhost 예외가 열리는 자리는 노드 자신뿐이고,
# ops 에서 사설 IP 로 붙으면 계정이 없어 거부된다. 셸이 없으면 그 자리에서 막힌다.
- name: 서비스 노드에 mongosh 설치
  ansible.builtin.package:
    name: mongodb-mongosh
    state: present
  when: mongodb_target == "server"

# ── 서비스 노드: 서버 ────────────────────────────────────────
- name: mongod 설치
  ansible.builtin.package:
    name: mongodb-org-server
    state: present
  when: mongodb_target == "server"

- name: 데이터 디렉터리 소유권
  ansible.builtin.file:
    path: "{{ mongodb_dbpath }}"
    state: directory
    owner: mongodb
    group: mongodb
    mode: "0755"
  when: mongodb_target == "server"

- name: 로그 디렉터리
  ansible.builtin.file:
    path: "{{ mongodb_logpath | dirname }}"
    state: directory
    owner: mongodb
    group: mongodb
    mode: "0755"
  when: mongodb_target == "server"

# keyFile 은 챕터 02 에서 만들어 두기만 한다. mongod.conf 에 넣는 것은 챕터 10 이다.
# 파일을 미리 두는 이유는, 인증을 켜는 순간 멤버 간 통신도 이 파일을 요구하기 때문이다.
# 나중에 만들려면 세 노드를 다시 만져야 한다.
#
# play-mongodb.yml 이 serial: 1 로 돌리므로 run_once 는 배치마다, 즉 노드마다
# 한 번씩 세 번 돈다. creates: 가 재생성을 막아 세 노드가 같은 내용을 받는다.
# serial 을 없애면 이 주석도 함께 지운다.
- name: keyFile 생성 (첫 노드에서 한 번)
  ansible.builtin.shell:
    cmd: openssl rand -base64 756 > /tmp/mongod.key
    creates: /tmp/mongod.key
  delegate_to: "{{ groups['mongo'][0] }}"
  run_once: true
  when: mongodb_target == "server"

- name: keyFile 읽기
  ansible.builtin.slurp:
    src: /tmp/mongod.key
  delegate_to: "{{ groups['mongo'][0] }}"
  run_once: true
  register: mongodb_keyfile_content

# 세 노드의 내용이 같아야 멤버가 서로를 받아들인다. 권한은 600 이어야 하고
# 아니면 mongod 가 기동을 거부한다.
- name: keyFile 배치 (서비스 노드)
  ansible.builtin.copy:
    content: "{{ mongodb_keyfile_content.content | b64decode }}"
    dest: "{{ mongodb_keyfile_path }}"
    owner: mongodb
    group: mongodb
    mode: "0600"
  when: mongodb_target == "server"

# ops 노드에도 같은 파일을 둔다. 챕터 12 에서 mongos 를 ops 에서 띄우는데,
# 인증이 켜진 뒤에는 mongos 도 keyFile 이 있어야 shard 와 config server 에 붙는다.
# ops 에는 mongodb 계정이 없으므로 azureuser 소유로 둔다.
- name: keyFile 배치 (ops 노드)
  ansible.builtin.copy:
    content: "{{ mongodb_keyfile_content.content | b64decode }}"
    dest: "{{ mongodb_keyfile_path }}"
    owner: "{{ ansible_user | default('azureuser') }}"
    group: "{{ ansible_user | default('azureuser') }}"
    mode: "0600"
  when: mongodb_target == "client"

- name: mongod.conf 배포
  ansible.builtin.template:
    src: mongod.conf.j2
    dest: /etc/mongod.conf
    owner: root
    group: root
    mode: "0644"
  notify: mongod 재시작
  when: mongodb_target == "server"

- name: mongod 기동
  ansible.builtin.systemd:
    name: mongod
    enabled: true
    state: started
    daemon_reload: true
  when: mongodb_target == "server"
