---
# 게스트 OS 안쪽은 전부 Ansible 의 몫이다. Terraform 은 디스크를 붙이는 데까지만 한다.

- name: 시간 동기화
  ansible.builtin.package:
    name: chrony
    state: present

- name: 데이터 디스크 파일 시스템
  community.general.filesystem:
    fstype: xfs
    dev: /dev/disk/azure/scsi1/lun0

# 마운트 지점은 세션마다 다르다. 세션 1 은 /var/lib/redis, 세션 2 는 /var/lib/mongodb 다.
# 기본값을 두어 세션 1 플레이북은 그대로 돈다.
- name: 데이터 디렉터리 마운트
  ansible.posix.mount:
    path: "{{ data_mount_path | default('/var/lib/redis') }}"
    src: /dev/disk/azure/scsi1/lun0
    fstype: xfs
    opts: noatime
    state: mounted

# fork 시점에 커널이 메모리 예약을 거부하면 BGSAVE 가 실패한다.
# 1 로 두면 예약을 허용하고 실제 사용 시점에 할당한다.
- name: vm.overcommit_memory
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    sysctl_set: true
    state: present
    reload: true

# THP 는 fork 를 느리게 만든다. 스냅샷 지연으로 이어진다.
- name: THP 비활성
  ansible.builtin.copy:
    dest: /etc/systemd/system/disable-thp.service
    mode: "0644"
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages
      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled'
      [Install]
      WantedBy=multi-user.target

- name: THP 서비스 기동
  ansible.builtin.systemd:
    name: disable-thp
    enabled: true
    state: started
    daemon_reload: true

# MongoDB 와 Redis 둘 다 랜덤 IO 가 많다. 큰 readahead 는 쓰지 않을 블록을
# 미리 읽어 캐시를 밀어낸다. 기본 128 섹터(64 KiB)를 32 섹터(16 KiB)로 줄인다.
- name: readahead 축소
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/85-readahead.rules
    mode: "0644"
    content: |
      ACTION=="add|change", KERNEL=="sd[a-z]", ATTR{queue/read_ahead_kb}="16"
  notify: udev 규칙 재적용
