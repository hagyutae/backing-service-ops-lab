---
# 게스트 OS 안쪽은 전부 Ansible 의 몫이다. Terraform 은 디스크를 붙이는 데까지만 한다.

# 이미지에 딸려 온 apt 목록은 오래됐고 universe 저장소가 빠져 있을 수 있다.
# 갱신하지 않으면 그 뒤의 패키지 설치가 "No package matching" 으로 실패한다.
#
# 세션 1·2 에서는 redis·mongodb 롤이 저장소를 등록하며 캐시를 갱신해 가려져
# 있었다. Kafka 는 배포본을 tarball 로 받아 저장소를 등록하는 태스크가 없고,
# 그래서 세션 3 검증에서 node exporter 설치가 두 노드에서 막혔다.
- name: 패키지 목록 갱신
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: 시간 동기화
  ansible.builtin.package:
    name: chrony
    state: present

- name: 데이터 디스크 파일 시스템
  community.general.filesystem:
    fstype: xfs
    dev: /dev/disk/azure/scsi1/lun0

# 마운트 지점은 세션마다 다르다. 세션 1 은 /var/lib/redis, 세션 2 는 /var/lib/mongodb 다.
# 기본값을 두어 세션 1 플레이북은 그대로 돈다.
- name: 데이터 디렉터리 마운트
  ansible.posix.mount:
    path: "{{ data_mount_path | default('/var/lib/redis') }}"
    src: /dev/disk/azure/scsi1/lun0
    fstype: xfs
    opts: noatime
    state: mounted

# fork 시점에 커널이 메모리 예약을 거부하면 BGSAVE 가 실패한다.
# 1 로 두면 예약을 허용하고 실제 사용 시점에 할당한다.
- name: vm.overcommit_memory
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    sysctl_set: true
    state: present
    reload: true

# THP 는 fork 를 느리게 만든다. 스냅샷 지연으로 이어진다.
- name: THP 비활성
  ansible.builtin.copy:
    dest: /etc/systemd/system/disable-thp.service
    mode: "0644"
    content: |
      [Unit]
      Description=Disable Transparent Huge Pages
      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'echo never > /sys/kernel/mm/transparent_hugepage/enabled'
      [Install]
      WantedBy=multi-user.target

- name: THP 서비스 기동
  ansible.builtin.systemd:
    name: disable-thp
    enabled: true
    state: started
    daemon_reload: true

# 값의 근거는 defaults/main.yml 의 common_read_ahead_kb 주석에 있다.
# 랜덤 IO 가 많은 세션은 줄이고, 순차 읽기인 Kafka 는 커널 기본값을 쓴다.
- name: readahead 설정
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/85-readahead.rules
    mode: "0644"
    content: |
      ACTION=="add|change", KERNEL=="sd[a-z]", ATTR{queue/read_ahead_kb}="{{ common_read_ahead_kb }}"
  notify: udev 규칙 재적용

# 파티션마다 세그먼트 파일과 인덱스 파일이 열린다. 기본 한도 1024 로는
# 파티션이 늘었을 때 브로커가 파일을 못 연다.
#
# 두 곳을 함께 올려야 한다. limits.d 는 로그인 셸에 걸리고, systemd 로
# 뜨는 서비스는 그 값을 받지 않는다. 유닛 파일의 LimitNOFILE 이 따로 필요하다.
# 여기서는 systemd 기본값을 올리고, 유닛에서 명시하는 것은 각 서비스 롤이 한다.
- name: 파일 핸들 한도 상향 (로그인 셸)
  ansible.builtin.copy:
    dest: /etc/security/limits.d/90-nofile.conf
    mode: "0644"
    content: |
      * soft nofile {{ common_nofile_limit }}
      * hard nofile {{ common_nofile_limit }}
      root soft nofile {{ common_nofile_limit }}
      root hard nofile {{ common_nofile_limit }}

# copy 는 없는 디렉터리를 만들지 않는다. system.conf.d 는 기본으로 없다.
- name: systemd drop-in 디렉터리
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 파일 핸들 한도 상향 (systemd 기본값)
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/90-nofile.conf
    mode: "0644"
    content: |
      [Manager]
      DefaultLimitNOFILE={{ common_nofile_limit }}
  notify: systemd 데몬 재적용
