---
# 열 수 있는 파일 개수의 한도.
#
# Kafka 는 파티션마다 세그먼트 파일과 인덱스 파일을 연다. 파티션이 늘면
# 열린 파일 수가 함께 늘어 기본 한도(1024)에 걸린다. 브로커가 파일을 못 열면
# 그 파티션이 멈춘다.
#
# Redis 와 MongoDB 는 이만큼 열지 않지만 올려서 해로울 것이 없다.
# 세 세션이 같은 값을 받는다.
common_nofile_limit: 65536

# 블록 장치의 readahead(KiB).
#
# Redis 와 MongoDB 는 랜덤 IO 가 많다. 큰 readahead 는 쓰지 않을 블록을 미리
# 읽어 캐시를 밀어내므로 기본 128 섹터(64 KiB)를 32 섹터(16 KiB)로 줄인다.
#
# Kafka 는 반대다. 세그먼트를 끝에서부터 순차로 읽으므로 미리 읽어 둔 블록이
# 곧바로 쓰인다. readahead 를 줄이면 순차 읽기의 요청 수만 늘어난다.
# play-kafka.yml 이 이 값을 커널 기본값으로 되돌린다.
common_read_ahead_kb: 16
