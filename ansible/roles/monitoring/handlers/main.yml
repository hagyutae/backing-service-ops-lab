---
- name: restart prometheus
  ansible.builtin.systemd:
    name: prometheus
    state: restarted

- name: restart grafana
  ansible.builtin.systemd:
    name: grafana-server
    state: restarted

- name: restart mongodb exporter
  ansible.builtin.systemd:
    name: mongodb-exporter
    state: restarted
    daemon_reload: true

- name: restart kafka exporter
  ansible.builtin.systemd:
    name: kafka-exporter
    state: restarted
    daemon_reload: true
