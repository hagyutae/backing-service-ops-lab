---
# monitoring_target 으로 두 가지를 나눈다.
#   node   : 서비스 노드에 exporter 를 깐다
#   server : ops 노드에 Prometheus 와 Grafana 를 올린다
#
# monitoring_service 로 어느 서비스인지 나눈다.
#   redis   : 세션 1. 기본값이라 play-redis.yml 은 값을 주지 않아도 된다
#   mongodb : 세션 2
#   kafka   : 세션 3
#
# node_exporter 는 서비스와 무관하게 공통이다. 서비스별 exporter 만 갈린다.
#
# monitoring_service 는 node 쪽에만 쓴다. server 쪽이 무엇을 긁고 어느
# 대시보드를 올릴지는 인벤토리에 있는 그룹이 정한다. 아래 「관측 대상
# 서비스 판정」을 본다. 세션 4 는 세 서비스를 함께 관측하므로 값 하나로
# 나눌 수 없다.

- name: node exporter 설치
  when: monitoring_target == "node"
  ansible.builtin.package:
    name: prometheus-node-exporter
    state: present

- name: node exporter 기동
  when: monitoring_target == "node"
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started

# ── Redis ────────────────────────────────────────────────────
- name: redis exporter 설치
  when: monitoring_target == "node" and monitoring_service == "redis"
  ansible.builtin.package:
    name: prometheus-redis-exporter
    state: present

- name: redis exporter 기동
  when: monitoring_target == "node" and monitoring_service == "redis"
  ansible.builtin.systemd:
    name: prometheus-redis-exporter
    enabled: true
    state: started

# ── MongoDB ──────────────────────────────────────────────────
# Ubuntu 저장소에 패키지가 없다. Percona 가 배포하는 바이너리를 내려받는다.
- name: mongodb exporter 내려받기
  when: monitoring_target == "node" and monitoring_service == "mongodb"
  ansible.builtin.unarchive:
    src: "https://github.com/percona/mongodb_exporter/releases/download/v{{ mongodb_exporter_version }}/mongodb_exporter-{{ mongodb_exporter_version }}.linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, --wildcards, "*/mongodb_exporter"]
    creates: /usr/local/bin/mongodb_exporter
    mode: "0755"

# 접속 문자열을 변수로 받는다. 챕터 10 에서 인증을 켜기 전까지는 계정이 비어 있고,
# 켠 뒤에는 clusterMonitor 계정을 넣어 다시 돌린다.
- name: mongodb exporter 유닛
  when: monitoring_target == "node" and monitoring_service == "mongodb"
  ansible.builtin.copy:
    dest: /etc/systemd/system/mongodb-exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=MongoDB Exporter
      After=network-online.target mongod.service

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/mongodb_exporter \
        --mongodb.uri={{ mongodb_exporter_uri }} \
        --web.listen-address=:9216 \
        --collect-all
      Restart=on-failure

      [Install]
      WantedBy=multi-user.target
  notify: restart mongodb exporter

- name: mongodb exporter 기동
  when: monitoring_target == "node" and monitoring_service == "mongodb"
  ansible.builtin.systemd:
    name: mongodb-exporter
    enabled: true
    state: started
    daemon_reload: true

# ── Kafka ────────────────────────────────────────────────────
# Ubuntu 저장소에 패키지가 없다. 배포되는 바이너리를 내려받는다.
- name: kafka exporter 내려받기
  when: monitoring_target == "node" and monitoring_service == "kafka"
  ansible.builtin.unarchive:
    src: "https://github.com/danielqsj/kafka_exporter/releases/download/v{{ kafka_exporter_version }}/kafka_exporter-{{ kafka_exporter_version }}.linux-amd64.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    extra_opts: [--strip-components=1, --wildcards, "*/kafka_exporter"]
    creates: /usr/local/bin/kafka_exporter
    mode: "0755"

# 세 브로커를 모두 준다. 한 대만 주면 그 노드가 죽는 순간 지표가 통째로 끊겨
# 「브로커 1대 정지」 실습에서 관찰할 대상이 사라진다.
- name: kafka exporter 유닛
  when: monitoring_target == "node" and monitoring_service == "kafka"
  ansible.builtin.copy:
    dest: /etc/systemd/system/kafka-exporter.service
    mode: "0644"
    content: |
      [Unit]
      Description=Kafka Exporter
      After=network-online.target kafka.service

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/kafka_exporter{% for host in groups['kafka'] %} --kafka.server={{ hostvars[host].ansible_host }}:{{ kafka_client_port | default(9092) }}{% endfor %} --web.listen-address=:{{ kafka_exporter_port }}
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: restart kafka exporter

- name: kafka exporter 기동
  when: monitoring_target == "node" and monitoring_service == "kafka"
  ansible.builtin.systemd:
    name: kafka-exporter
    enabled: true
    state: started
    daemon_reload: true

# Ubuntu 24.04 저장소에는 grafana 패키지가 없다. 공식 저장소를 등록한다.
- name: Grafana 저장소 키
  when: monitoring_target == "server"
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /usr/share/keyrings/grafana.asc
    mode: "0644"

# 미러가 동기화 중이면 인덱스 크기가 맞지 않아 실패한다.
# 실제로 검증 중에 겪었다. 상류 사정이라 우리가 막을 수는 없고, 잠시 뒤 풀린다.
# 20명이 같은 시각에 같은 미러를 때리는 구성이라 재시도를 넉넉히 둔다.
- name: Grafana 저장소 등록
  when: monitoring_target == "server"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/grafana.asc] https://apt.grafana.com stable main"
    filename: grafana
    state: present
    update_cache: true
  register: grafana_repo
  retries: 6
  delay: 20
  until: grafana_repo is succeeded

# redis-tools 에 redis-cli 와 redis-benchmark 가 들어 있다.
# 서버는 깔지 않는다. ops 노드는 부하를 주는 쪽이지 받는 쪽이 아니다.
- name: Prometheus 와 Grafana, Redis 클라이언트 설치
  when: monitoring_target == "server"
  ansible.builtin.package:
    name:
      - prometheus
      - grafana
      - redis-tools
    state: present

- name: Grafana 프로비저닝 디렉터리
  when: monitoring_target == "server"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: grafana
    group: grafana
    mode: "0755"
  loop:
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    - /var/lib/grafana/dashboards

- name: Grafana 데이터소스와 대시보드 공급자
  when: monitoring_target == "server"
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: grafana
    group: grafana
    mode: "0644"
  loop:
    - { src: datasource.yaml.j2, dest: /etc/grafana/provisioning/datasources/prometheus.yaml }
    - { src: dashboards.yaml.j2, dest: /etc/grafana/provisioning/dashboards/lab.yaml }
  notify: restart grafana

# 인벤토리에 있는 그룹으로 관측 대상 서비스를 정한다.
#
# 세션 1 부터 세션 3 은 서비스 그룹이 하나뿐이라 한 개가 나오고, 세션 4 의
# 04-operation 은 셋이 나온다. 아래 대시보드 배포와 prometheus.yml 이 이 값을 쓴다.
#
# monitoring_service 로 나누지 않는 이유는 그 변수가 값 하나라 세 서비스를
# 함께 관측하는 세션 4 를 표현하지 못하기 때문이다.
# 그룹이 「있는가」가 아니라 「비어 있지 않은가」로 본다.
# 세션 4 는 단계마다 인벤토리를 갈아 끼우는데, 빈 그룹 머리가 남으면
# 대상 없는 job 이 생겨 Targets 화면에 아무것도 안 띄운다.
# 세션 1 부터 세션 3 은 그룹이 하나뿐이고 비어 있지 않아 결과가 같다.
- name: 관측 대상 서비스 판정
  when:
    - monitoring_target == "server"
    - groups[item.value.node_groups[0]] | default([]) | length > 0
  ansible.builtin.set_fact:
    monitoring_present: "{{ (monitoring_present | default([])) + [item.key] }}"
  loop: "{{ monitoring_catalog | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

# 인벤토리에 있는 서비스의 대시보드만 올린다. 없는 서비스 것을 함께 올리면
# 지표가 없는 패널이 빈 채로 남아 수강생이 장애로 오해한다.
- name: 실습 대시보드 배포
  when: monitoring_target == "server"
  ansible.builtin.copy:
    src: "{{ item }}-lab.json"
    dest: "/var/lib/grafana/dashboards/{{ item }}-lab.json"
    owner: grafana
    group: grafana
    mode: "0644"
  loop: "{{ ((monitoring_node_dashboard | bool | ternary(['node'], [])) + (monitoring_present | default([]))) | difference(['redis', 'mongodb', 'kafka']) }}"
  notify: restart grafana

# 서비스 대시보드 셋은 템플릿이다. 패널을 defaults 의 <서비스>_dashboard_panels
# 목록에서 만든다. 패널을 더하거나 질의를 고칠 때 JSON 을 손대지 않고 그 목록만 고친다.
# node-lab.json 만 아직 JSON 을 그대로 쓴다.
- name: 서비스 대시보드 배포
  when: monitoring_target == "server"
  ansible.builtin.template:
    src: "{{ item }}-lab.json.j2"
    dest: "/var/lib/grafana/dashboards/{{ item }}-lab.json"
    owner: grafana
    group: grafana
    mode: "0644"
  loop: "{{ monitoring_present | default([]) }}"
  notify: restart grafana

# ── 앞 단계의 대시보드를 지운다 ──────────────────────────────
# ops 노드는 세션 내내 유지되므로 배포만 하면 앞 단계 JSON 이 그대로 남는다.
# 세션 4 에서 MongoDB 단계로 넘어가도 Grafana 목록에 redis-lab 이 보이고,
# 그 패널은 데이터가 끊긴 채 비어 있다. 수강생이 「전환이 실패했다」로 읽는다.
#
# 세션 1 부터 세션 3 은 서비스가 하나뿐이라 지울 것이 없다.
- name: 지난 단계의 대시보드 정리
  when: monitoring_target == "server"
  ansible.builtin.file:
    path: "/var/lib/grafana/dashboards/{{ item }}-lab.json"
    state: absent
  loop: "{{ monitoring_catalog.keys() | list | difference(monitoring_present | default([])) }}"
  notify: restart grafana

# 알람 규칙 파일. 수강생이 실습에서 직접 채운다.
# 이미 있으면 덮어쓰지 않는다. 플레이북을 다시 돌려도 쓴 규칙이 살아남아야 한다.
- name: 알람 규칙 뼈대 배포
  when: monitoring_target == "server"
  ansible.builtin.template:
    src: alert-rules.yml.j2
    dest: /etc/prometheus/alert-rules.yml
    owner: prometheus
    group: prometheus
    mode: "0644"
    force: false
  notify: restart prometheus

- name: prometheus.yml 배포
  when: monitoring_target == "server"
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
  notify: restart prometheus

- name: 관측 스택 기동
  when: monitoring_target == "server"
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - prometheus
    - grafana-server
