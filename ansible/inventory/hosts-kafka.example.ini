# 세션 3 · Kafka 운영 인벤토리 예시
#
# terraform apply 가 이 파일과 같은 내용을 만들어 ops 노드의
# ~/lab/ansible/inventory/hosts.ini 에 배치한다. 이 파일은 그 모양을
# 미리 보여 주는 것이고, 노드를 늘릴 때 무엇을 덧붙이면 되는지의 본이다.
#
# kafka_node_id 는 server.properties 의 node.id 와 controller.quorum.voters
# 에 함께 들어간다. 둘이 어긋나면 브로커가 기동 직후 종료한다.

[kafka]
kafka-1 ansible_host=10.0.1.5 kafka_node_id=1
kafka-2 ansible_host=10.0.1.6 kafka_node_id=2
kafka-3 ansible_host=10.0.1.7 kafka_node_id=3

[ops]
ops-1 ansible_connection=local

[all:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/id_rsa

kafka_client_port=9092
kafka_controller_port=9093
