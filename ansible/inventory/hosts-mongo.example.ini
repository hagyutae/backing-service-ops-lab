# 세션 2 · MongoDB 운영 인벤토리
#
# ops-1 에서 실행. 서비스 노드에는 공인 IP 가 없으므로 사설 IP 로만 닿음
# 실제로 쓰는 파일은 Terraform 이 부팅 때 hosts.ini 로 덮어써 둔다.
# 챕터 12 에서 노드를 아홉 대로 늘릴 때는 이 파일을 직접 고친다.

[mongo]
mongo-1 ansible_host=10.0.1.5
mongo-2 ansible_host=10.0.1.6
mongo-3 ansible_host=10.0.1.7

[ops]
ops-1 ansible_connection=local

[all:vars]
ansible_user=azureuser
ansible_ssh_private_key_file=~/.ssh/id_rsa

mongodb_port=27017
mongodb_replset_name=rs0

# 챕터 06 에서 -e mongodb_replset_enabled=true 로 덮어써 복제를 켠다
mongodb_replset_enabled=false
